# Overridable at runtime:  mvn test -Dbrowser=firefox -Dheadless=false
base.url=https://www.saucedemo.com/
browser=chrome
headless=true
explicit.wait=15

api.base.uri=https://restful-booker.herokuapp.com

# In-memory H2 so the DB tests run anywhere.
# Real project example:
#   db.url=jdbc:mysql://qa-db.internal:3306/shop
#   db.user=qa_readonly
db.url=jdbc:h2:mem:qadb;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
