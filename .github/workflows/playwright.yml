name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  client-shopping-js:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/playwright/Javascript Projects/clientShopping
    env:
      SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
      SHOP_ALT_EMAIL: ${{ secrets.SHOP_ALT_EMAIL }}
      SHOP_ALT_PASSWORD: ${{ secrets.SHOP_ALT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-automation/playwright/Javascript Projects/clientShopping/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: client-shopping-js-report
          path: ui-automation/playwright/Javascript Projects/clientShopping/playwright-report/
          retention-days: 30

  client-shopping-ts:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/playwright/Typescript Projects/client-Shopping
    env:
      SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
      SHOP_ALT_EMAIL: ${{ secrets.SHOP_ALT_EMAIL }}
      SHOP_ALT_PASSWORD: ${{ secrets.SHOP_ALT_PASSWORD }}
      SHOP_REGISTRATION_EMAIL: ${{ secrets.SHOP_REGISTRATION_EMAIL }}
      SHOP_REGISTRATION_PASSWORD: ${{ secrets.SHOP_REGISTRATION_PASSWORD }}
      EVENTS_EMAIL: ${{ secrets.EVENTS_EMAIL }}
      EVENTS_PASSWORD: ${{ secrets.EVENTS_PASSWORD }}
      GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
      YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
      LOGIN_PRACTICE_USERNAME: ${{ secrets.LOGIN_PRACTICE_USERNAME }}
      LOGIN_PRACTICE_PASSWORD: ${{ secrets.LOGIN_PRACTICE_PASSWORD }}
      PRACTICE_FORM_NAME: ${{ secrets.PRACTICE_FORM_NAME }}
      PRACTICE_FORM_EMAIL: ${{ secrets.PRACTICE_FORM_EMAIL }}
      PRACTICE_FORM_PASSWORD: ${{ secrets.PRACTICE_FORM_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-automation/playwright/Typescript Projects/client-Shopping/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: client-shopping-ts-report
          path: ui-automation/playwright/Typescript Projects/client-Shopping/playwright-report/
          retention-days: 30

  greenkart:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/playwright/Typescript Projects/greenKart-shopping
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-automation/playwright/Typescript Projects/greenKart-shopping/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: greenkart-report
          path: ui-automation/playwright/Typescript Projects/greenKart-shopping/playwright-report/
          retention-days: 30

  automation-exercise:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/playwright/Typescript Projects/automationExercice
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-automation/playwright/Typescript Projects/automationExercice/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Run tests
        env:
          EMAIL: ${{ secrets.PAYMENT_EMAIL }}
          PASSWORD: ${{ secrets.PAYMENT_PASSWORD }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::automationExercice tests skipped; set PAYMENT_EMAIL and PAYMENT_PASSWORD repository secrets to enable them."
            exit 0
          fi
          npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: automation-exercise-report
          path: ui-automation/playwright/Typescript Projects/automationExercice/playwright-report/
          retention-days: 30

  azure-playwright:
    if: >-
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.RUN_AZURE_PLAYWRIGHT == 'true')) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ui-automation/playwright/Javascript Projects/clientShopping
    env:
      SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
      SHOP_ALT_EMAIL: ${{ secrets.SHOP_ALT_EMAIL }}
      SHOP_ALT_PASSWORD: ${{ secrets.SHOP_ALT_PASSWORD }}
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-automation/playwright/Javascript Projects/clientShopping/package-lock.json
      - run: npm ci
      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Run tests on Azure Playwright Workspaces
        run: |
          test -n "$PLAYWRIGHT_SERVICE_URL" || (echo "PLAYWRIGHT_SERVICE_URL is empty" && exit 1)
          npm run test:azure
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: azure-playwright-report
          path: ui-automation/playwright/Javascript Projects/clientShopping/playwright-report/
          retention-days: 30
