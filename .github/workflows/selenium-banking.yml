name: Selenium Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'  # Runs every Monday 9 AM — shows ongoing maintenance

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/selenium-java/BankingApplication/qa-automation-banking

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Run Selenium Tests
      env:
        GURU99_USER_ID: ${{ secrets.GURU99_USER_ID }}
        GURU99_PASSWORD: ${{ secrets.GURU99_PASSWORD }}
      run: mvn -B test -Dbrowser=chrome -Dheadless=true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: extent-reports
        path: reports/