name: QA Regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite file'
        default: 'testng.xml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-automation/selenium-java/E2E-SauceDemo-Framework
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]   # cross-browser matrix
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run suite
        run: mvn -B test -DsuiteXmlFile=${{ github.event.inputs.suite || 'testng.xml' }} -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.browser }}
          # upload-artifact ignores defaults.run.working-directory, so paths are repo-relative
          path: |
            ui-automation/selenium-java/E2E-SauceDemo-Framework/target/extent-report.html
            ui-automation/selenium-java/E2E-SauceDemo-Framework/target/screenshots/
            ui-automation/selenium-java/E2E-SauceDemo-Framework/target/surefire-reports/
